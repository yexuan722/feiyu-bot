<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>大肥鱼小号驾驶舱</title>
<style>
  :root {
    --ink: #17233b;
    --ink-soft: #4a5872;
    --muted: #8794ab;
    --line: #e4ebf6;
    --blue: #3b74f2;
    --blue-deep: #2a5bd7;
    --blue-soft: #ecf2ff;
    --pink: #ff8fb1;
    --bg: #f3f7fd;
    --card: #ffffff;
    --ok: #1f9d68;
    --warn: #d97706;
    --bad: #d94a4a;
    --radius: 16px;
    --shadow: 0 1px 2px rgba(23,35,59,.05), 0 8px 24px -12px rgba(23,35,59,.18);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background:
      radial-gradient(1200px 500px at 12% -10%, #e2edff 0%, rgba(226,237,255,0) 60%),
      radial-gradient(900px 420px at 95% 0%, #ffe9f1 0%, rgba(255,233,241,0) 55%),
      var(--bg);
    color: var(--ink);
    font: 14px/1.6 "Segoe UI", "Microsoft YaHei", "PingFang SC", system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--blue); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ---------- header ---------- */
  header {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
    padding: 14px 26px;
    background: rgba(255,255,255,.78);
    backdrop-filter: saturate(140%) blur(14px);
    border-bottom: 1px solid rgba(228,235,246,.9);
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-right: auto; }
  .fish {
    width: 46px; height: 46px; border-radius: 15px;
    display: grid; place-items: center; font-size: 24px;
    background: linear-gradient(145deg, #dfeaff, #f5f9ff);
    border: 1px solid #d9e6ff;
    box-shadow: inset 0 -2px 0 rgba(59,116,242,.12);
  }
  .brand h1 { font-size: 17px; margin: 0; letter-spacing: .3px; }
  .brand p { margin: 1px 0 0; font-size: 12px; color: var(--muted); }

  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 11px; border-radius: 999px; font-size: 12px;
    background: #fff; border: 1px solid var(--line); color: var(--ink-soft);
    white-space: nowrap;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--ok); box-shadow: 0 0 0 3px rgba(31,157,104,.14); }
  .dot.off { background: var(--bad); box-shadow: 0 0 0 3px rgba(217,74,74,.12); }
  .dot.warn { background: var(--warn); box-shadow: 0 0 0 3px rgba(217,119,6,.12); }

  .actions { display: flex; gap: 8px; }
  .btn {
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    padding: 8px 14px; border-radius: 11px; font-size: 13px; cursor: pointer;
    transition: .16s ease; font-family: inherit;
  }
  .btn:hover { border-color: #c9d8f2; background: #f8fbff; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn.primary {
    background: linear-gradient(180deg, var(--blue), var(--blue-deep));
    border-color: var(--blue-deep); color: #fff;
    box-shadow: 0 6px 16px -8px rgba(59,116,242,.9);
  }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.ghost { color: var(--ink-soft); }
  .btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; }
  .btn.tiny { padding: 5px 10px; font-size: 12px; border-radius: 9px; }

  /* ---------- layout ---------- */
  main {
    max-width: 1460px; margin: 0 auto; padding: 22px 26px 80px;
    display: grid; grid-template-columns: minmax(0, 1.12fr) minmax(0, .88fr); gap: 24px;
    align-items: start;
  }
  .col-head { display: flex; align-items: baseline; gap: 10px; margin: 4px 2px 12px; }
  .col-head h2 { font-size: 14px; margin: 0; letter-spacing: .5px; }
  .col-head .hint { font-size: 12px; color: var(--muted); margin-left: auto; }
  .count {
    display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px;
    border-radius: 999px; background: var(--blue-soft); color: var(--blue-deep);
    font-size: 12px; font-weight: 600; margin-left: 6px; vertical-align: 1px;
  }
  .cards { display: flex; flex-direction: column; gap: 12px; }

  /* ---------- card ---------- */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 14px 16px 12px; position: relative; overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: linear-gradient(180deg, var(--blue), #9dbbff);
  }
  .card.reply::before { background: linear-gradient(180deg, var(--pink), #ffc2d4); }
  .who { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ava {
    width: 26px; height: 26px; border-radius: 9px; display: grid; place-items: center;
    background: linear-gradient(145deg, #dbe8ff, #f2f7ff); color: var(--blue-deep);
    font-size: 12px; font-weight: 700; border: 1px solid #dbe6fb; flex: 0 0 auto;
  }
  .who b { font-size: 13px; }
  .tag {
    font-size: 11px; padding: 1px 7px; border-radius: 6px;
    background: var(--blue-soft); color: var(--blue-deep);
  }
  .tag.reply { background: #fff0f5; color: #cf4f7d; }
  .time { font-size: 11px; color: var(--muted); }
  .angle { font-size: 11px; color: var(--muted); margin-left: auto; }

  .quote {
    margin: 10px 0 6px; padding: 8px 11px; border-radius: 10px;
    background: #f7faff; border: 1px dashed #dde7f8; color: var(--ink-soft);
    font-size: 13px; word-break: break-word;
  }
  .ctx { font-size: 12px; color: var(--muted); margin: 2px 0 8px; padding-left: 2px; }
  .ctx b { color: var(--ink-soft); font-weight: 500; }
  .vtitle {
    display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px;
    color: var(--blue-deep); margin-bottom: 8px; max-width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  textarea {
    width: 100%; min-height: 64px; resize: vertical; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 11px; background: #fcfdff;
    font: 14px/1.65 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: var(--ink); outline: none; transition: .16s;
  }
  textarea:focus {
    border-color: #b9cdf5; background: #fff;
    box-shadow: 0 0 0 4px rgba(59,116,242,.1);
  }
  .foot { display: flex; align-items: center; gap: 8px; margin-top: 9px; }
  .chars { font-size: 11px; color: var(--muted); }
  .chars.over { color: var(--bad); }
  .btns { display: flex; gap: 8px; margin-left: auto; }
  .err {
    margin-top: 9px; padding: 7px 10px; border-radius: 9px; font-size: 12px;
    background: #fff4f4; border: 1px solid #ffdcdc; color: #a92f2f;
  }

  /* ---------- feed ---------- */
  .feed { gap: 10px; }
  .fcard {
    display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: start;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 11px 13px; box-shadow: 0 1px 2px rgba(23,35,59,.04);
    transition: .16s;
  }
  .fcard:hover { border-color: #cfe0fb; transform: translateY(-1px); box-shadow: var(--shadow); }
  .rank {
    width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center;
    font-size: 13px; font-weight: 700; color: var(--blue-deep);
    background: linear-gradient(145deg, #e6efff, #f7fbff); border: 1px solid #dbe7fb;
  }
  .rank.hot { color: #c2410c; background: linear-gradient(145deg, #ffeadb, #fff8f2); border-color: #ffe0c7; }
  .ftitle { font-size: 13.5px; font-weight: 600; line-height: 1.45; color: var(--ink); }
  .ftitle:hover { color: var(--blue-deep); }
  .meta { font-size: 11.5px; color: var(--muted); margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; }
  .why { font-size: 12px; color: var(--ink-soft); margin-top: 5px; }
  .why::before { content: "“"; color: #c3cfe4; }
  .why::after { content: "”"; color: #c3cfe4; }
  .fbtns { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }

  /* ---------- logs ---------- */
  .logs {
    background: #0f1a2c; color: #b9c8e0; border-radius: 14px; padding: 12px 14px;
    font: 12px/1.75 ui-monospace, "Cascadia Mono", Consolas, monospace;
    max-height: 260px; overflow-y: auto; margin-top: 12px;
    border: 1px solid #1c2c46;
  }
  .logs div { white-space: pre-wrap; word-break: break-all; }
  .logs .t { color: #5d719a; margin-right: 8px; }

  /* ---------- empty / toast ---------- */
  .empty {
    text-align: center; padding: 42px 20px; color: var(--muted);
    border: 1px dashed #d9e4f5; border-radius: var(--radius); background: rgba(255,255,255,.55);
  }
  .empty .big { font-size: 30px; display: block; margin-bottom: 8px; filter: saturate(.85); }
  .empty b { display: block; color: var(--ink-soft); font-weight: 600; margin-bottom: 4px; }
  .empty small { font-size: 12px; }

  #toast {
    position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px);
    background: #17233b; color: #fff; padding: 10px 18px; border-radius: 12px;
    font-size: 13px; opacity: 0; pointer-events: none; transition: .22s ease;
    box-shadow: 0 12px 30px -12px rgba(0,0,0,.5); max-width: 80vw; z-index: 50;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #toast.bad { background: #8f2f2f; }

  .footnote { max-width: 1460px; margin: -50px auto 0; padding: 0 26px 30px; }
  .footnote p { font-size: 11.5px; color: var(--muted); margin: 0; }

  @media (max-width: 1080px) {
    main { grid-template-columns: 1fr; }
    .footnote { margin-top: 0; }
  }
  @media (max-width: 640px) {
    header { padding: 12px 14px; gap: 10px; }
    .brand p { display: none; }
    main { padding: 16px 14px 60px; }
    .actions { width: 100%; }
    .actions .btn { flex: 1; }
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="fish">🐟</div>
    <div>
      <h1>大肥鱼小号驾驶舱</h1>
      <p>有人 @ 它，它就来干饭；闲着就去捞好视频</p>
    </div>
  </div>
  <div class="pills" id="pills"></div>
  <div class="actions">
    <button class="btn ghost" id="btnPoll">扫一通</button>
    <button class="btn ghost" id="btnDiscover">捞视频</button>
    <button class="btn" id="btnRefresh">刷新</button>
  </div>
</header>

<main>
  <section class="col">
    <div class="col-head">
      <h2>待发队列</h2><span class="count" id="pendingCount">0</span>
      <span class="hint" id="limitHint"></span>
    </div>
    <div class="cards" id="drafts"></div>
    <div id="failedWrap"></div>
  </section>

  <section class="col">
    <div class="col-head">
      <h2>本鱼捞的</h2>
      <span class="hint">点开直接跳 B站</span>
    </div>
    <div class="feed" id="feed"></div>
    <div class="col-head" style="margin-top:20px">
      <h2>运行日志</h2><span class="hint">最近 50 行</span>
    </div>
    <div class="logs" id="logs"></div>
  </section>
</main>

<div class="footnote">
  <p>全部在本机跑：Cookie 存在 <code>config.json</code>，只用来调 B站 自己的接口，不发给任何人。关掉这个窗口就停了。</p>
</div>

<div id="toast"></div>

<script>
const S = { state: null, edits: {}, busy: false, maxChars: 80 };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
));

function toast(msg, bad) {
  const el = $("toast");
  el.textContent = msg;
  el.className = "show" + (bad ? " bad" : "");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => (el.className = ""), 2600);
}

async function api(path, body) {
  const res = await fetch(path, {
    method: body === undefined ? "GET" : "POST",
    headers: { "Content-Type": "application/json" },
    body: body === undefined ? undefined : JSON.stringify(body),
  });
  return res.json();
}

/* ---------------- 渲染 ---------------- */

function renderPills(st) {
  const s = st.status, stat = st.stats;
  const mode = s.auto_send ? "全自动" : "半自动";
  const pill = (dot, label) => `<span class="pill"><i class="dot ${dot}"></i>${esc(label)}</span>`;
  $("pills").innerHTML = [
    pill(s.cookie_ready ? "on" : "off", s.cookie_ready ? (s.uid ? "已登录 · UID " + s.uid : "Cookie 已填") : "没登录"),
    pill(s.model_ready ? "on" : "warn", s.model_ready ? esc(s.model) : "模型没配"),
    pill(s.auto_send ? "warn" : "on", mode),
    pill("", `今日已发 ${stat.sent_today} · 待发 ${stat.pending}`),
  ].join("");
  $("limitHint").textContent =
    `限速 ${st.limits.max_per_hour}/小时 · ${st.limits.max_per_day}/天 · 间隔 ${st.limits.min_gap_seconds}s`;
  $("pendingCount").textContent = stat.pending;
}

function draftCard(d, mode) {
  const value = (d.id in S.edits) ? S.edits[d.id] : d.body;
  const len = (value || "").length;
  const over = len > S.maxChars;
  const kindCls = d.kind === "reply" ? "reply" : "";
  const url = d.url ? esc(d.url) : "";
  const failed = mode === "failed";
  const mainBtn = failed
    ? `<button class="btn tiny primary" data-act="retry" data-id="${d.id}">重试</button>`
    : `<button class="btn tiny primary" data-act="send" data-id="${d.id}" ${over ? "disabled" : ""}>发送</button>`;
  return `
  <article class="card ${kindCls}" data-id="${d.id}">
    <div class="who">
      <span class="ava">${esc((d.who || "?").slice(0, 1))}</span>
      <b>${esc(d.who)}</b>
      <span class="tag ${kindCls}">${esc(d.kind_label)}</span>
      <span class="time">${esc(d.age)}</span>
      <span class="angle">${esc(d.angle)}</span>
    </div>
    ${d.trigger_text ? `<blockquote class="quote">${esc(d.trigger_text)}</blockquote>` : ""}
    ${d.context ? `<div class="ctx">你原来那条：<b>${esc(d.context)}</b></div>` : ""}
    ${url ? `<a class="vtitle" href="${url}" target="_blank" rel="noreferrer">▶ ${esc(d.title)}</a>`
          : `<div class="vtitle" style="color:#8794ab">▶ ${esc(d.title)}（没拿到链接）</div>`}
    <textarea data-id="${d.id}" placeholder="写点什么…" spellcheck="false">${esc(value)}</textarea>
    <div class="foot">
      <span class="chars ${over ? "over" : ""}" data-count="${d.id}">${len}/${S.maxChars}</span>
      <div class="btns">
        ${failed ? "" : `<button class="btn tiny ghost" data-act="skip" data-id="${d.id}">跳过</button>`}
        ${mainBtn}
      </div>
    </div>
    ${d.error ? `<div class="err">${esc(d.error)}</div>` : ""}
  </article>`;
}

function renderDrafts(st) {
  S.maxChars = st.limits.max_reply_chars || 80;
  const list = st.drafts;
  $("drafts").innerHTML = list.length
    ? list.map((d) => draftCard(d, "pending")).join("")
    : `<div class="empty"><span class="big">🍚</span><b>队列空着</b>
         <small>没人 @ 它，或者已经都回了。点右上角「扫一通」试试。</small></div>`;

  const failed = st.failed || [];
  $("failedWrap").innerHTML = failed.length
    ? `<div class="col-head" style="margin-top:18px"><h2>发送失败</h2>
         <span class="hint">多半是风控或 Cookie 过期，看看报错再决定</span></div>
       <div class="cards">${failed.map((d) => draftCard(d, "failed")).join("")}</div>`
    : "";
}

function renderFeed(st) {
  const list = st.feed;
  $("feed").innerHTML = list.length
    ? list.map((f, i) => `
      <div class="fcard">
        <div class="rank ${f.score >= 8 ? "hot" : ""}">${i + 1}</div>
        <div>
          <a class="ftitle" href="${esc(f.url)}" target="_blank" rel="noreferrer">${esc(f.title)}</a>
          <div class="meta">
            <span>${esc(f.owner || "未知UP")}</span>
            <span>${esc(f.tname || "")}</span>
            <span>${fmtDur(f.duration)}</span>
            <span>${fmtNum(f.view_count)} 播放</span>
            <span>${esc(f.source)}</span>
          </div>
          ${f.reason ? `<div class="why">${esc(f.reason)}</div>` : ""}
        </div>
        <div class="fbtns">
          <span class="pill" style="font-size:11px">${f.score} 分</span>
          <button class="btn tiny ghost" data-hide="${f.id}">没意思</button>
        </div>
      </div>`).join("")
    : `<div class="empty"><span class="big">🎣</span><b>还没捞到东西</b>
         <small>点「捞视频」，本鱼去首页摸一圈。</small></div>`;
}

function renderLogs(st) {
  $("logs").innerHTML = (st.logs || []).map((l) => {
    const t = new Date(l.t * 1000).toLocaleTimeString("zh-CN", { hour12: false });
    return `<div><span class="t">${t}</span>${esc(l.msg)}</div>`;
  }).join("") || `<div class="t">（还没有日志）</div>`;
}

function fmtDur(sec) {
  sec = Number(sec) || 0;
  const m = Math.floor(sec / 60), s = sec % 60;
  return m ? `${m}:${String(s).padStart(2, "0")}` : `${s}s`;
}
function fmtNum(n) {
  n = Number(n) || 0;
  if (n >= 100000000) return (n / 100000000).toFixed(1) + "亿";
  if (n >= 10000) return (n / 10000).toFixed(1) + "万";
  return String(n);
}

function render() {
  const st = S.state;
  if (!st) return;
  renderPills(st);
  renderDrafts(st);
  renderFeed(st);
  renderLogs(st);
}

/* ---------------- 交互 ---------------- */

document.addEventListener("input", (e) => {
  const el = e.target;
  if (el.tagName !== "TEXTAREA") return;
  const id = el.dataset.id;
  S.edits[id] = el.value;
  const counter = document.querySelector(`[data-count="${id}"]`);
  if (counter) {
    counter.textContent = `${el.value.length}/${S.maxChars}`;
    counter.classList.toggle("over", el.value.length > S.maxChars);
  }
  const card = el.closest(".card");
  const btn = card && card.querySelector('[data-act="send"]');
  if (btn) btn.disabled = el.value.length > S.maxChars;
});

document.addEventListener("click", async (e) => {
  const btn = e.target.closest("button[data-act], button[data-hide]");
  if (!btn || S.busy) return;

  if (btn.dataset.hide) {
    const res = await api("/api/hide", { id: Number(btn.dataset.hide) });
    toast(res.message);
    await refresh();
    return;
  }

  const id = Number(btn.dataset.id);
  const act = btn.dataset.act;
  if (act === "skip") {
    const res = await api("/api/skip", { id });
    delete S.edits[id];
    toast(res.message);
    await refresh();
    return;
  }
  if (act === "retry") {
    const res = await api("/api/retry", { id });
    toast(res.message);
    await refresh();
    return;
  }
  if (act === "send") {
    const card = btn.closest(".card");
    const area = card.querySelector("textarea");
    const body = area.value.trim();
    if (!body) return toast("内容空了，写一句再发", true);
    btn.disabled = true;
    btn.textContent = "发送中…";
    S.busy = true;
    const res = await api("/api/send", { id, body });
    S.busy = false;
    btn.textContent = "发送";
    if (res.ok) delete S.edits[id];
    toast(res.message, !res.ok);
    await refresh();
  }
});

async function refresh() {
  try {
    S.state = await api("/api/state");
    render();
  } catch (err) {
    toast("连不上后台，python feiyu_bot.py up 跑起来了吗？", true);
  }
}

async function action(path, btn, label) {
  if (S.busy) return;
  S.busy = true;
  const old = btn.textContent;
  btn.disabled = true;
  btn.textContent = label;
  try {
    const res = await api(path, {});
    toast(res.message, !res.ok);
  } catch (err) {
    toast("请求失败：" + err, true);
  }
  S.busy = false;
  btn.disabled = false;
  btn.textContent = old;
  await refresh();
}

$("btnRefresh").onclick = () => { refresh(); toast("已刷新"); };
$("btnPoll").onclick = (e) => action("/api/poll", e.target, "扫扫扫…");
$("btnDiscover").onclick = (e) => action("/api/discover", e.target, "捞捞捞…");

document.addEventListener("visibilitychange", () => {
  if (!document.hidden) refresh();
});

refresh();
setInterval(() => { if (!document.hidden) refresh(); }, 12000);
</script>
</body>
</html>
